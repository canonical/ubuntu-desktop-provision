name: ubuntu_wizard
description: Shared library for Ubuntu wizards.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.0.0
  ubuntu_flavor: ^0.5.0
  ubuntu_localizations: ^0.6.0
  ubuntu_widgets: ^0.9.0
  wizard_router: ^1.2.0
  yaru: ^12.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  # html 0.15.7 removed query_selector's matches(), which flutter_html 3.0.0 still calls
  html: '>=0.15.4 <0.15.7'
  ubuntu_lints: ^0.4.0
  ubuntu_test: ^0.3.0
  yaru_test: ^1.0.0
